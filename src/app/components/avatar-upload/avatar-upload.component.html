<div class="avatar-upload">
  <!-- Avatar Display -->
  <div class="avatar-container">
    <div *ngIf="preview" class="avatar-preview">
      <img [src]="preview" [alt]="userName" class="avatar-image">
      <button type="button" class="remove-btn" (click)="removeAvatar()" title="Remove avatar">
        ✕
      </button>
    </div>

    <div *ngIf="!preview" class="avatar-placeholder">
      <div class="initials" *ngIf="userName">{{ getInitials(userName) }}</div>
      <div class="no-avatar" *ngIf="!userName">👤</div>
    </div>

    <!-- File Size Info -->
    <div *ngIf="preview" class="file-info">
      <small>Avatar set</small>
    </div>
  </div>

  <!-- Upload Area -->
  <div 
    class="upload-area"
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="triggerFileInput()">
    
    <div class="upload-content">
      <div class="upload-icon">📤</div>
      <h3>Click to upload or drag and drop</h3>
      <p class="upload-hint">SVG, PNG, JPG, GIF or WebP (MAX. 5MB)</p>
      <button 
        type="button" 
        class="btn btn-primary btn-sm"
        (click)="triggerFileInput()">
        Select Image
      </button>
    </div>

    <!-- Upload Progress -->
    <div *ngIf="isUploading" class="upload-progress">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="uploadProgress"></div>
      </div>
      <span class="progress-text">{{ uploadProgress }}%</span>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input 
    #fileInput
    type="file" 
    accept="image/*"
    style="display: none;"
    (change)="onFileSelected($event)">

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    <span class="error-icon">⚠️</span>
    {{ errorMessage }}
  </div>
</div>
