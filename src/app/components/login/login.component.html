<div class="login-container">
  <div class="login-modal">
    <div class="login-card">
      <h2 class="login-title" (click)="navigateToWelcome()" [style.cursor]="'pointer'">LabourLink</h2>
      <p class="login-subtitle">Worker Management System</p>
      
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" formControlName="username" placeholder="Enter your username">
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Enter your password">
        </div>
        
        <div *ngIf="error" class="alert alert-danger">
          <strong>Error:</strong> {{error}}
        </div>
        
        <button type="submit" class="btn btn-login" [disabled]="form.invalid">
          Login
        </button>
      </form>
      
      <div class="login-footer">
        <p class="demo-creds">Demo: username=admin, password=admin</p>
      </div>
    </div>
  </div>
</div>
